    <!--prerender:start--><noscript><style>.nojs{max-width:46rem;margin:0 auto;padding:2rem 1.25rem 4rem;font:17px/1.55 system-ui,sans-serif;color:#f5f5f7;background:#000}.nojs h1{font-size:2.2rem;line-height:1.1;margin:1.5rem 0 1rem}.nojs h2{font-size:1.6rem;margin:2.5rem 0 .75rem}.nojs h3{font-size:1.2rem;margin:1.5rem 0 .5rem}.nojs p,.nojs div{margin:.5rem 0}.nojs ul,.nojs ol{padding-left:1.25rem}.nojs a{color:#2997ff}</style><div class="nojs"><div><a href="/he">Stocker TV </a> <div><div><a href="/he#how">איך זה עובד</a> <a href="/he#trust">אמינות</a> <a href="/he#always-on">שווקים</a> <a href="/he#faq">שאלות נפוצות</a> </div><a href="/feed">הדגמה חיה (באנגלית)</a> <a href="/privacy">English</a> </div></div><div><h1>מדיניות פרטיות</h1><p>בתוקף מ-7 באוקטובר 2026</p><p>בקצרה: האתר הזה לא עוקב אחריכם. אין עוגיות, אין כלי ניתוח ואין עוקבי פרסום. אם תשלחו לנו דואר אלקטרוני, נשתמש בהודעה שלכם כדי להשיב לכם. הפרטים המלאים מופיעים בהמשך.</p><h2>בעמוד זה</h2><div><h2>מי אנחנו</h2><div><p>האתר מופעל על ידי StockerTV („StockerTV”, „אנחנו”). אנחנו אחראים למידע האישי המתואר במדיניות זו.</p><p>שאלות בנושא פרטיות אפשר לשלוח אל <a href="mailto:iddo.etkin@gmail.com">iddo.etkin@gmail.com</a> .</p></div></div><div><h2>על מה חלה המדיניות</h2><p>מדיניות זו חלה על האתר stockertv.com, כולל ההדגמה החיה. היא אינה חלה על תוכן של StockerTV שתראו בתוך אפליקציה של חברה אחרת. אם בנק או פלטפורמת מסחר מציגים סרטוני StockerTV בשירות שלהם, הודעת הפרטיות של אותה חברה חלה על השימוש שלכם בשירות שלה, ואנחנו מעבדים שם מידע רק כפי שנקבע בהסכם שלנו עם אותה חברה.</p></div><div><h2>איזה מידע אנחנו אוספים</h2><div><p>אנחנו מצמצמים למינימום את המידע שהאתר מטפל בו:</p><ul><li>הודעות שאתם שולחים לנו. אם תכתבו לנו בדואר אלקטרוני, למשל כדי לבקש פיילוט, נקבל את כתובת הדואר שלכם, את שמכם אם תציינו אותו, ואת כל מה שתכתבו.</li><li>יומני שרת טכניים. כמו בכל אתר, השרתים שמגישים את האתר רושמים מידע טכני, כגון כתובת IP, סוג הדפדפן, העמוד שהתבקש ומועד הבקשה. היומנים משמשים לתפעול האתר ולאבטחתו.</li><li>הגדרה אחת במכשיר שלכם. האתר שומר באחסון ההפעלה (session storage) של הדפדפן את המזהה של סרטון הדוגמה האחרון שצפיתם בו, כדי שדף הבית יוכל להציג אותו כשתחזרו. המידע לא יוצא מהמכשיר שלכם, ונמחק כשסוגרים את הכרטיסייה.</li></ul><p>איננו משתמשים באתר בעוגיות (cookies), בכלי ניתוח, בעוקבי פרסום או בפיקסלים של רשתות חברתיות, ואיננו טוענים גופנים, סקריפטים או סרטונים משירותים של צד שלישי. איננו מוכרים מידע אישי.</p></div></div><div><h2>למה אנחנו משתמשים במידע</h2><div><p>אנחנו משתמשים במידע אישי רק כדי:</p><ul><li>להשיב להודעה שלכם ולדון איתכם בפיילוט או בהסכם אפשרי;</li><li>לתפעל את האתר, לאבטח אותו ולטפל בתקלות;</li><li>לעמוד בחובות לפי דין, ולבסס טענות משפטיות או להתגונן מפניהן.</li></ul><p>כאשר חלה תקנת הגנת המידע הכללית של האיחוד האירופי או של בריטניה (GDPR), הבסיסים החוקיים שלנו הם האינטרס הלגיטימי שלנו להשיב לפניות עסקיות ולהפעיל אתר מאובטח, צעדים שננקטים לבקשתכם לפני התקשרות בחוזה, ועמידה בחובות לפי דין.</p></div></div><div><h2>עם מי אנחנו משתפים את המידע</h2><div><p>אנחנו משתפים מידע אישי רק עם ספקי שירות שעוזרים לנו לנהל את העסק, כגון ספקי אחסון האתר והדואר האלקטרוני, במסגרת חוזים שמחייבים אותם להגן עליו ולהשתמש בו רק לפי הנחיותינו. אנחנו עשויים גם למסור מידע כאשר הדין מחייב זאת, או כדי להגן על זכויותינו.</p><p>ייתכן שחלק מהספקים יעבדו מידע מחוץ למדינה שלכם, כולל מחוץ לאזור הכלכלי האירופי. במקרים כאלה אנחנו מסתמכים על אמצעי הגנה מתאימים, כגון החלטות הלימות או סעיפים חוזיים תקניים.</p></div></div><div><h2>כמה זמן אנחנו שומרים את המידע</h2><p>אנחנו שומרים התכתבויות כל עוד הדבר נדרש לטיפול בפנייה שלכם ובכל קשר עסקי שנוצר בעקבותיה, ולאחר מכן כל עוד הדין מחייב או מתיר זאת. יומני שרת נשמרים לתקופה מוגבלת לצורכי אבטחה, ולאחר מכן נמחקים.</p></div><div><h2>הזכויות שלכם</h2><div><p>בהתאם למקום מגוריכם, ייתכן שעומדת לכם הזכות לעיין במידע האישי שאנחנו מחזיקים עליכם, לתקן אותו או למחוק אותו, להגביל את השימוש בו או להתנגד לו, ולקבל עותק שלו. לפי חוק הגנת הפרטיות הישראלי, אתם רשאים לבקש לעיין במידע עליכם, ולבקש לתקן אותו או למחוק אותו.</p><p>כדי לממש זכות כלשהי מאלה, כתבו אל <a href="mailto:iddo.etkin@gmail.com">iddo.etkin@gmail.com</a> . עומדת לכם גם הזכות להגיש תלונה לרשות להגנת מידע: בישראל, הרשות להגנת הפרטיות; באיחוד האירופי, רשות הפיקוח במקום מגוריכם.</p></div></div><div><h2>אבטחה</h2><p>אנחנו נוקטים אמצעים טכניים וארגוניים סבירים להגנה על מידע אישי, כולל חיבורים מוצפנים (HTTPS). אף שיטת העברה או אחסון אינה מאובטחת לחלוטין, ולכן איננו יכולים להבטיח אבטחה מוחלטת.</p></div><div><h2>ילדים</h2><p>האתר מיועד לעסקים. הוא אינו מכוון לילדים, ואיננו אוספים ביודעין מידע על ילדים.</p></div><div><h2>שינויים במדיניות</h2><p>אם נשנה את האופן שבו האתר מטפל במידע אישי, למשל אם נוסיף כלי ניתוח, נעדכן את העמוד הזה ואת תאריך התחולה שלו לפני שהשינוי ייכנס לתוקף.</p></div></div><div><ol><li><p>סרטוני StockerTV הם סיכומים, שנוצרו בבינה מלאכותית, של חדשות שפורסמו בפומבי על חברות. הם נבדקים מול ספר של 24 כללים אוטומטיים, וכפופים לבדיקה אנושית ולבדיקת הלקוח. הם מוצגים למטרות מידע בלבד, ואינם ייעוץ השקעות, ייעוץ פיננסי, ייעוץ משפטי או ייעוץ מס, ואינם המלצה או שידול לקנות או למכור נייר ערך כלשהו. התוכן עשוי להכיל טעויות. יש לבדוק תמיד את המקורות המקוריים.</p></li><li>סרטוני הדוגמה הופקו בתהליך של StockerTV מחדשות ציבוריות על חברות; הנתונים הם כפי שדווחו באותה עת ואינם מתעדכנים. הדוגמאות בספר הכללים משתמשות בחברות בדיוניות.</li></ol><div><p>© 2026 StockerTV. כל הזכויות שמורות.</p><div><a href="/developers">מפתחים</a> <a href="/security">אבטחה ונתונים</a> <a href="/he/privacy">מדיניות פרטיות</a> <a href="/terms">תנאי שימוש</a> <a href="/he/accessibility">נגישות</a> <a href="/StockerTV-one-pager.pdf">דף מידע (PDF)</a> </div></div><p>דפי המפתחים, האבטחה ותנאי השימוש זמינים כרגע באנגלית.</p></div></div></noscript><!--prerender:end-->
