    <!--prerender:start--><noscript><style>.nojs{max-width:46rem;margin:0 auto;padding:2rem 1.25rem 4rem;font:17px/1.55 system-ui,sans-serif;color:#f5f5f7;background:#000}.nojs h1{font-size:2.2rem;line-height:1.1;margin:1.5rem 0 1rem}.nojs h2{font-size:1.6rem;margin:2.5rem 0 .75rem}.nojs h3{font-size:1.2rem;margin:1.5rem 0 .5rem}.nojs p,.nojs div{margin:.5rem 0}.nojs ul,.nojs ol{padding-left:1.25rem}.nojs a{color:#2997ff}</style><div class="nojs"><div><a href="/">Stocker TV </a> <div><div><a href="/#how">How it works</a> <a href="/#trust">Trust</a> <a href="/#always-on">Markets</a> <a href="/#faq">FAQ</a> </div><a href="/feed">Live demo</a> </div></div><div><h1>Accessibility Statement</h1><p>Effective October 7, 2026</p><p>This website is built to meet WCAG 2.1 Level AA and Israeli Standard SI 5568. This statement explains what we’ve done, what we know still needs work, and how to reach us.</p><h2>On this page</h2><div><h2>Our commitment</h2><p>StockerTV wants this website to be usable by everyone, including people who use assistive technology. We design and test it to meet the Web Content Accessibility Guidelines (WCAG) 2.1 at Level AA, in line with Israeli Standard SI 5568.</p></div><div><h2>What we’ve done</h2><ul><li>Semantic page structure with landmarks and a logical heading order, plus a “Skip to content” link.</li><li>Every function works with a keyboard, with a clearly visible focus indicator.</li><li>Buttons, menus, dialogs and tabs carry accessible names, roles and states for screen readers; dialogs keep focus inside and close with Escape.</li><li>Text and essential graphics meet WCAG contrast ratios (at least 4.5:1 for normal text), measured for every text color we use.</li><li>Text sizes are set in relative units, so the site follows your browser’s font-size setting and stays usable at 200% zoom and on narrow screens.</li><li>Animation respects the “reduce motion” setting of your device, and moving content that lasts more than five seconds has a pause control.</li><li>Videos start muted and carry captions; each has a full transcript, with English translations for videos in other languages.</li><li>Images that convey information have text alternatives; decorative images are hidden from assistive technology.</li><li>No content flashes, and nothing on the site is time-limited.</li></ul></div><div><h2>How we test</h2><p>We check every key page and interactive state with automated testing (axe-core), test keyboard-only use, and check layouts at 200% zoom and at a 320-pixel screen width. We last reviewed the site on October 7, 2026.</p></div><div><h2>Known limitations</h2><div><p>We are aware of the following and are working to improve them:</p><ul><li>The sample videos do not include separate audio description. Most on-screen information is also spoken, and each video’s full transcript is available from its “Script” button.</li><li>Captions burned into the videos are in the video’s original language and cannot be resized. Larger English captions and the transcript are provided alongside them.</li><li>The interactive globe is a visual feature. The same information — each market, its local time and whether it is open — is available as an accessible list next to it.</li></ul></div></div><div><h2>Contact us about accessibility</h2><div><p>If you have trouble using any part of this website, or have a suggestion, please tell us. Include the page address and a short description of the problem, and we will respond as soon as we can.</p><div>Email: <a href="mailto:iddo.etkin@gmail.com?subject=Accessibility">iddo.etkin@gmail.com</a> </div></div></div></div><div><ol><li><p>StockerTV videos are AI-generated summaries of publicly reported company news, validated against a 24-rule automated rulebook and subject to human and client review. They are provided for information only and are not investment, financial, legal or tax advice, nor a recommendation or solicitation to buy or sell any security. Content may contain errors. Always consult the original sources.</p></li><li>Sample videos were produced by the StockerTV pipeline from public company news; figures are as reported at the time and are not updated. Rulebook examples use fictional companies.</li></ol><div><p>Copyright © 2026 StockerTV. All rights reserved.</p><div><a href="/developers">Developers</a> <a href="/security">Security &amp; data</a> <a href="/privacy">Privacy Policy</a> <a href="/terms">Terms of Use</a> <a href="/accessibility">Accessibility</a> <a href="/StockerTV-one-pager.pdf">One-pager (PDF)</a> </div></div></div></div></noscript><!--prerender:end-->
