    <!--prerender:start--><noscript><style>.nojs{max-width:46rem;margin:0 auto;padding:2rem 1.25rem 4rem;font:17px/1.55 system-ui,sans-serif;color:#f5f5f7;background:#000}.nojs h1{font-size:2.2rem;line-height:1.1;margin:1.5rem 0 1rem}.nojs h2{font-size:1.6rem;margin:2.5rem 0 .75rem}.nojs h3{font-size:1.2rem;margin:1.5rem 0 .5rem}.nojs p,.nojs div{margin:.5rem 0}.nojs ul,.nojs ol{padding-left:1.25rem}.nojs a{color:#2997ff}</style><div class="nojs"><div><a href="/he">Stocker TV </a> <div><div><a href="/he#how">איך זה עובד</a> <a href="/he#trust">אמינות</a> <a href="/he#always-on">שווקים</a> <a href="/he#faq">שאלות נפוצות</a> </div><a href="/feed">הדגמה חיה (באנגלית)</a> <a href="/accessibility">English</a> </div></div><div><h1>הצהרת נגישות</h1><p>בתוקף מ-7 באוקטובר 2026</p><p>האתר בנוי לעמוד ברמה AA של הנחיות WCAG 2.1 ובתקן הישראלי ת״י 5568. ההצהרה מסבירה מה עשינו, מה עוד דורש שיפור, ואיך אפשר לפנות אלינו.</p><h2>בעמוד זה</h2><div><h2>המחויבות שלנו</h2><p>StockerTV רוצה שכל אחד יוכל להשתמש באתר, כולל אנשים שמשתמשים בטכנולוגיה מסייעת. אנחנו מתכננים ובודקים את האתר כך שיעמוד בהנחיות לנגישות תכני אינטרנט, WCAG 2.1 , ברמה AA, בהתאם לתקן הישראלי ת״י 5568 ולתקנות שוויון זכויות לאנשים עם מוגבלות (התאמות נגישות לשירות), התשע״ג-2013.</p></div><div><h2>מה עשינו</h2><ul><li>מבנה עמוד סמנטי, עם אזורי ניווט (landmarks) וסדר כותרות הגיוני, וקישור „דלגו לתוכן”.</li><li>כל פעולה באתר אפשרית באמצעות המקלדת, עם סימון פוקוס ברור.</li><li>לכפתורים, לתפריטים, לחלונות ולכרטיסיות יש שמות, תפקידים ומצבים נגישים לקוראי מסך; חלונות שומרים את הפוקוס בתוכם ונסגרים במקש Escape.</li><li>הטקסט והגרפיקה החיונית עומדים ביחסי הניגודיות של WCAG (לפחות 4.5:1 לטקסט רגיל), כפי שנמדד לכל צבע טקסט שבו אנחנו משתמשים.</li><li>גודלי הטקסט מוגדרים ביחידות יחסיות, כך שהאתר מכבד את הגדרת גודל הגופן בדפדפן שלכם, ונשאר שמיש בהגדלה של 200% ובמסכים צרים.</li><li>האנימציות מכבדות את הגדרת „הפחתת תנועה” במכשיר שלכם, ולתוכן נע שנמשך יותר מחמש שניות יש כפתור השהיה.</li><li>סרטונים מתחילים ללא קול וכוללים כתוביות; לכל סרטון יש תמליל מלא, עם תרגום לאנגלית לסרטונים בשפות אחרות.</li><li>לתמונות שמעבירות מידע יש חלופות טקסטואליות; תמונות קישוטיות מוסתרות מטכנולוגיה מסייעת.</li><li>תפריט נגישות (הלשונית שבצד כל עמוד) מאפשר טקסט גדול יותר, ניגודיות גבוהה, עצירת אנימציות וקו תחתון לקישורים.</li><li>אין באתר תוכן מהבהב, ואין בו פעולות מוגבלות בזמן.</li></ul></div><div><h2>איך אנחנו בודקים</h2><p>אנחנו בודקים כל עמוד מרכזי וכל מצב אינטראקטיבי בבדיקות אוטומטיות (axe-core), בודקים שימוש במקלדת בלבד, ובודקים את הפריסה בהגדלה של 200% וברוחב מסך של 320 פיקסלים. בדקנו את האתר לאחרונה ב-7 באוקטובר 2026.</p></div><div><h2>מגבלות ידועות</h2><div><p>אנחנו מודעים לנושאים הבאים ופועלים לשפר אותם:</p><ul><li>לסרטוני הדוגמה אין תיאור קולי נפרד. רוב המידע שעל המסך גם נאמר בקול, והתמליל המלא של כל סרטון זמין דרך הכפתור „Script”.</li><li>הכתוביות הצרובות בסרטונים הן בשפת המקור של הסרטון, ולא ניתן להגדיל אותן. לצידן מוצגים כתוביות גדולות יותר באנגלית והתמליל.</li><li>הגלובוס האינטראקטיבי הוא רכיב חזותי. אותו מידע (כל שוק, השעה המקומית בו והאם הוא פתוח) זמין ברשימה נגישה לצידו.</li><li>חלק מעמודי האתר זמינים כרגע באנגלית בלבד: ההדגמות, דף המפתחים, דף האבטחה ותנאי השימוש. הסרט בדף הבית הוא באנגלית, ותרגום הקריינות לעברית מופיע מתחתיו.</li></ul></div></div><div><h2>פנייה בנושא נגישות</h2><div><p>אם נתקלתם בקושי בשימוש בחלק כלשהו של האתר, או שיש לכם הצעה, נשמח לשמוע. ציינו את כתובת העמוד ותיאור קצר של הבעיה, ונשיב בהקדם האפשרי.</p><div>דואר אלקטרוני: <a href="mailto:iddo.etkin@gmail.com?subject=%D7%A0%D7%92%D7%99%D7%A9%D7%95%D7%AA">iddo.etkin@gmail.com</a> </div></div></div></div><div><ol><li><p>סרטוני StockerTV הם סיכומים, שנוצרו בבינה מלאכותית, של חדשות שפורסמו בפומבי על חברות. הם נבדקים מול ספר של 24 כללים אוטומטיים, וכפופים לבדיקה אנושית ולבדיקת הלקוח. הם מוצגים למטרות מידע בלבד, ואינם ייעוץ השקעות, ייעוץ פיננסי, ייעוץ משפטי או ייעוץ מס, ואינם המלצה או שידול לקנות או למכור נייר ערך כלשהו. התוכן עשוי להכיל טעויות. יש לבדוק תמיד את המקורות המקוריים.</p></li><li>סרטוני הדוגמה הופקו בתהליך של StockerTV מחדשות ציבוריות על חברות; הנתונים הם כפי שדווחו באותה עת ואינם מתעדכנים. הדוגמאות בספר הכללים משתמשות בחברות בדיוניות.</li></ol><div><p>© 2026 StockerTV. כל הזכויות שמורות.</p><div><a href="/developers">מפתחים</a> <a href="/security">אבטחה ונתונים</a> <a href="/he/privacy">מדיניות פרטיות</a> <a href="/terms">תנאי שימוש</a> <a href="/he/accessibility">נגישות</a> <a href="/StockerTV-one-pager.pdf">דף מידע (PDF)</a> </div></div><p>דפי המפתחים, האבטחה ותנאי השימוש זמינים כרגע באנגלית.</p></div></div></noscript><!--prerender:end-->
