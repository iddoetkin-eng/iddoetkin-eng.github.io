    <!--prerender:start--><noscript><style>.nojs{max-width:46rem;margin:0 auto;padding:2rem 1.25rem 4rem;font:17px/1.55 system-ui,sans-serif;color:#f5f5f7;background:#000}.nojs h1{font-size:2.2rem;line-height:1.1;margin:1.5rem 0 1rem}.nojs h2{font-size:1.6rem;margin:2.5rem 0 .75rem}.nojs h3{font-size:1.2rem;margin:1.5rem 0 .5rem}.nojs p,.nojs div{margin:.5rem 0}.nojs ul,.nojs ol{padding-left:1.25rem}.nojs a{color:#2997ff}</style><div class="nojs"><div><a href="/">Stocker TV </a> <div><div><a href="/#how">How it works</a> <a href="/#trust">Trust</a> <a href="/#always-on">Markets</a> <a href="/#faq">FAQ</a> </div><a href="/feed">Live demo</a> </div></div><div><h1>Privacy Policy</h1><p>Effective October 7, 2026</p><p>The short version: this website does not track you. No cookies, no analytics, no advertising trackers. If you email us, we use your message to reply. The details are below.</p><h2>On this page</h2><div><h2>Who we are</h2><div><p>This website is operated by StockerTV (“StockerTV”, “we”, “us”). We are responsible for the personal data described in this policy.</p><p>Questions about privacy can be sent to <a href="mailto:iddo.etkin@gmail.com">iddo.etkin@gmail.com</a> .</p></div></div><div><h2>What this policy covers</h2><p>This policy covers the website at stockertv.com, including the live demo. It does not cover StockerTV content you may see inside another company’s app. If a bank or trading platform shows StockerTV videos in its service, that company’s privacy notice applies to your use of its service, and we process data there only as set out in our agreement with that company.</p></div><div><h2>What we collect</h2><div><p>We keep the data this website handles to a minimum:</p><ul><li>Messages you send us. If you email us — for example to request a pilot — we receive your email address, your name if you include it, and whatever you write.</li><li>Technical server logs. Like any website, the servers that deliver this site record technical information such as IP address, browser type, the page requested and the time of the request. These logs are used to keep the site running and secure.</li><li>One setting on your device. The site stores the identifier of the last sample video you watched in your browser’s session storage, so the home page can show it when you return. It never leaves your device and is deleted when you close the tab.</li></ul><p>We do not use cookies, analytics tools, advertising trackers or social-media pixels on this website, and we do not load fonts, scripts or videos from third-party services. We do not sell personal data.</p></div></div><div><h2>Why we use it</h2><div><p>We use personal data only to:</p><ul><li>reply to your message and discuss a possible pilot or agreement with you;</li><li>operate, secure and troubleshoot the website;</li><li>comply with legal obligations and establish or defend legal claims.</li></ul><p>Where the EU or UK General Data Protection Regulation applies, our legal bases are our legitimate interest in responding to business enquiries and running a secure website, steps taken at your request before entering into a contract, and compliance with legal obligations.</p></div></div><div><h2>Who we share it with</h2><div><p>We share personal data only with service providers that help us run our business — such as our website hosting and email providers — under contracts that require them to protect it and use it only on our instructions. We may also disclose data where the law requires it, or to protect our rights.</p><p>Some providers may process data outside your country, including outside the European Economic Area. Where that happens, we rely on appropriate safeguards such as adequacy decisions or standard contractual clauses.</p></div></div><div><h2>How long we keep it</h2><p>We keep correspondence for as long as needed to handle your enquiry and any business relationship that follows, and then for as long as the law requires or allows. Server logs are kept for a limited period for security purposes and then deleted.</p></div><div><h2>Your rights</h2><div><p>Depending on where you live, you may have the right to access the personal data we hold about you, to correct or delete it, to restrict or object to how we use it, and to receive a copy of it. Under the Israeli Privacy Protection Law you may ask to inspect information about you and ask that it be corrected or deleted.</p><p>To exercise any of these rights, write to <a href="mailto:iddo.etkin@gmail.com">iddo.etkin@gmail.com</a> . You also have the right to complain to a data protection authority — in Israel, the Privacy Protection Authority; in the EU, the supervisory authority where you live.</p></div></div><div><h2>Security</h2><p>We use reasonable technical and organisational measures to protect personal data, including encrypted connections (HTTPS). No method of transmission or storage is completely secure, so we cannot guarantee absolute security.</p></div><div><h2>Children</h2><p>This website is intended for businesses. It is not directed at children, and we do not knowingly collect children’s data.</p></div><div><h2>Changes to this policy</h2><p>If we change how this website handles personal data — for example by adding analytics — we will update this page and its effective date before the change takes effect.</p></div></div><div><ol><li><p>StockerTV videos are AI-generated summaries of publicly reported company news, validated against a 24-rule automated rulebook and subject to human and client review. They are provided for information only and are not investment, financial, legal or tax advice, nor a recommendation or solicitation to buy or sell any security. Content may contain errors. Always consult the original sources.</p></li><li>Sample videos were produced by the StockerTV pipeline from public company news; figures are as reported at the time and are not updated. Rulebook examples use fictional companies.</li></ol><div><p>Copyright © 2026 StockerTV. All rights reserved.</p><div><a href="/developers">Developers</a> <a href="/security">Security &amp; data</a> <a href="/privacy">Privacy Policy</a> <a href="/terms">Terms of Use</a> <a href="/accessibility">Accessibility</a> <a href="/StockerTV-one-pager.pdf">One-pager (PDF)</a> </div></div></div></div></noscript><!--prerender:end-->
