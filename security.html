    <!--prerender:start--><noscript><style>.nojs{max-width:46rem;margin:0 auto;padding:2rem 1.25rem 4rem;font:17px/1.55 system-ui,sans-serif;color:#f5f5f7;background:#000}.nojs h1{font-size:2.2rem;line-height:1.1;margin:1.5rem 0 1rem}.nojs h2{font-size:1.6rem;margin:2.5rem 0 .75rem}.nojs h3{font-size:1.2rem;margin:1.5rem 0 .5rem}.nojs p,.nojs div{margin:.5rem 0}.nojs ul,.nojs ol{padding-left:1.25rem}.nojs a{color:#2997ff}</style><div class="nojs"><div><a href="/">Stocker TV </a> <div><div><a href="/#how">How it works</a> <a href="/#trust">Trust</a> <a href="/#always-on">Markets</a> <a href="/#faq">FAQ</a> </div><a href="/feed">Live demo</a> <a href="/he">עברית</a> </div></div><div><h1>Security &amp; data</h1><p>Last updated October 11, 2026</p><p>The short version: StockerTV needs no personal data about your users, never touches their orders or accounts, and nothing it produces appears in your app until it has passed automated validation, human review where needed, and your own team’s approval.</p><h2>On this page</h2><div><h2>Your users’ data</h2><div><p>StockerTV needs no personal data about your users. You don’t send us names, emails, account numbers or holdings, and the player doesn’t ask for them.</p><p>To report pilot results to you, the player measures anonymous, aggregate engagement, such as how often videos are played, without identifying individual users.</p></div></div><div><h2>Trading stays in your app</h2><div><p>The BUY and SELL buttons under a video hand the ticker to your own order ticket, through a trade address you set. StockerTV passes the ticker; the order itself is placed inside your app, under your existing controls, so StockerTV needs no access to your users’ orders or accounts.</p><p>The order ticket in our live demo is simulated: prices are generated and no order is ever sent.</p></div></div><div><h2>Where the content comes from</h2><div><p>Stories are built from SEC filings and Tier-1 financial news sources. Every claim in a script is attributed to its source. Background company data (sector, products, history) is used only as context and is never presented as news.</p><p>Scripts run 70 to 95 words and are written from sourced facts only. They never predict, recommend or use advice language.</p></div></div><div><h2>Three lines of defence before anything is shown</h2><div><ol><li>Automated validation. Three layers check every script against a 24-rule rulebook: a phrase scan, a rule-by-rule semantic review, and a holistic read against the source facts. The rules cover seven categories: forward-looking statements, fair balance, attribution, market manipulation, promotional language, editorial neutrality and disclosure.</li><li>Human review. Anything uncertain goes to a human review queue. Nothing is auto-published.</li><li>Your approval. Validated stories wait in your team’s approval queue. Your content managers decide what appears on your platform; nothing goes live until they approve it.</li></ol><p>The system fails closed. If a check can’t run, the script doesn’t ship.</p></div></div><div><h2>Disclosure on every video</h2><div><p>Every video is labelled as an AI-generated news summary and carries a disclaimer that it is information only, not investment advice.</p><p>Approved scripts can be translated into 15 languages; the languages for your pilot are agreed during scoping.</p></div></div><div><h2>For your risk and security teams</h2><div><p>Every script keeps an audit trail: its sources, scores and decision history. The full rulebook and a governance pack (model card, AI governance framework and incident response plan) are available to your risk team under NDA. Integration details are scoped with your team for each pilot.</p><p>Send questions about security and data to <a href="mailto:iddo.etkin@gmail.com?subject=Security%20and%20data%20questions">iddo.etkin@gmail.com</a> . How this website itself handles data is in our <a href="/privacy">Privacy Policy</a> .</p></div></div></div><div><ol><li><p>StockerTV videos are AI-generated summaries of publicly reported company news, validated against a 24-rule automated rulebook and subject to human and client review. They are provided for information only and are not investment, financial, legal or tax advice, nor a recommendation or solicitation to buy or sell any security. Content may contain errors. Always consult the original sources.</p></li><li>Sample videos were produced by the StockerTV pipeline from public company news; figures are as reported at the time and are not updated. Rulebook examples use fictional companies.</li></ol><div><p>© 2026 StockerTV. All rights reserved.</p><div><a href="/developers">Developers</a> <a href="/security">Security &amp; data</a> <a href="/privacy">Privacy Policy</a> <a href="/terms">Terms of Use</a> <a href="/accessibility">Accessibility</a> <a href="/StockerTV-one-pager.pdf">One-pager (PDF)</a> </div></div></div></div></noscript><!--prerender:end-->
